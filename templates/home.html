<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NoteFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-dark text-white">

<nav class="navbar navbar-dark bg-black shadow">

    <div class="container">

        <h2 class="text-info fw-bold">
            NoteFlow
        </h2>

        <form action="/logout/" method="post">

            {% csrf_token %}

            <button class="btn btn-danger">
                Logout
            </button>

        </form>

    </div>

</nav>

<div class="container mt-5">

    <div class="row">

        <div class="col-md-4">

            <div class="card bg-secondary shadow p-4">

                <h3 class="text-center mb-4">
                    Add Note
                </h3>

                <form method="POST">

                    {% csrf_token %}

                    <input
                        type="text"
                        name="title"
                        class="form-control mb-3"
                        placeholder="Enter title"
                    >

                    <textarea
                        name="content"
                        rows="5"
                        class="form-control mb-3"
                        placeholder="Write your note..."
                    ></textarea>

                    <button class="btn btn-info w-100">
                        Save Note
                    </button>

                </form>

            </div>

        </div>

        <div class="col-md-8">

            <form method="GET" class="mb-4">

                <input
                    type="text"
                    name="search"
                    class="form-control"
                    placeholder="Search notes..."
                >

            </form>

            <h2 class="mb-4">
                Your Notes
            </h2>

            {% for note in notes %}

            <div class="card bg-black text-white shadow mb-3">

                <div class="card-body">

                    <h3 class="text-info">
                        {{ note.title }}
                    </h3>

                    <p>
                        {{ note.content }}
                    </p>

                    <small class="text-secondary">
                        {{ note.created_at }}
                    </small>

                    <br><br>

                    <a
                        href="/edit/{{ note.id }}/"
                        class="btn btn-warning"
                    >
                        Edit
                    </a>

                    <a
                        href="/delete/{{ note.id }}/"
                        class="btn btn-danger"
                    >
                        Delete
                    </a>

                </div>

            </div>

            {% empty %}

            <div class="alert alert-warning">

                No notes available.

            </div>

            {% endfor %}

        </div>

    </div>

</div>

</body>

</html>
